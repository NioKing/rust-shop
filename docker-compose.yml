services:
  postgres:
    image: postgres:latest
    container_name: axum-shop-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgres/data

  redis:
    image: redis/redis-stack:latest
    container_name: axum-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: axum-shop-rmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pg_data:
